<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusHub - 极简高效番茄钟与待办</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
            min-height: 100vh;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-100 flex flex-col items-center justify-between p-4 sm:p-8">

    <header class="w-full max-w-xl flex justify-between items-center mb-6">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-bolt text-white text-lg"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">FocusHub</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-slate-800 transition text-slate-300">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
            <button onclick="resetData()" title="重置数据" class="w-10 h-10 rounded-xl glass flex items-center justify-center hover:bg-rose-500/20 hover:text-rose-400 transition text-slate-300">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <main class="w-full max-w-xl flex flex-col space-y-6">

        <!-- Motivational Quote Card -->
        <div class="glass rounded-2xl p-4 shadow-xl flex items-center space-x-4 border-l-4 border-indigo-500">
            <div class="text-indigo-400 text-xl pl-1">
                <i class="fa-solid fa-quote-left"></i>
            </div>
            <div class="flex-1">
                <p id="quote-text" class="text-sm text-slate-300 italic">“保持专注，行动是治愈焦虑的良药。”</p>
            </div>
            <button onclick="newQuote()" class="text-slate-400 hover:text-white transition text-xs">
                <i class="fa-solid fa-dice"></i>
            </button>
        </div>

        <!-- Pomodoro Timer Component -->
        <div class="glass rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>

            <!-- Mode selector tabs -->
            <div class="flex bg-slate-900/60 p-1.5 rounded-2xl mb-8 space-x-1 border border-white/5">
                <button onclick="switchMode('pomodoro')" id="btn-pomodoro" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">番茄专注 (25m)</button>
                <button onclick="switchMode('shortBreak')" id="btn-shortBreak" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white">短休 (5m)</button>
                <button onclick="switchMode('longBreak')" id="btn-longBreak" class="px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white">长休 (15m)</button>
            </div>

            <!-- Timer Display -->
            <div class="relative flex items-center justify-center my-4">
                <div class="text-6xl sm:text-7xl font-extrabold tracking-wider font-mono text-white drop-shadow-md" id="timer-display">25:00</div>
            </div>

            <!-- Control Buttons -->
            <div class="flex items-center space-x-4 mt-6">
                <button onclick="toggleTimer()" id="start-btn" class="px-8 py-3.5 bg-gradient-to-r from-indigo-500 to-indigo-600 hover:from-indigo-600 hover:to-indigo-700 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-500/30 transition transform active:scale-95 flex items-center space-x-2">
                    <i id="start-icon" class="fa-solid fa-play"></i>
                    <span id="start-text">开始专注</span>
                </button>
                <button onclick="resetTimer()" class="px-5 py-3.5 glass hover:bg-slate-800 text-slate-300 font-semibold rounded-2xl transition transform active:scale-95">
                    <i class="fa-solid fa-arrow-rotate-left"></i>
                </button>
            </div>
        </div>

        <!-- Todo List Component -->
        <div class="glass rounded-3xl p-6 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-base font-bold text-slate-200 flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-indigo-400"></i>
                    <span>今日待办清单</span>
                </h2>
                <span id="task-counter" class="text-xs text-slate-400 bg-slate-900/60 px-2.5 py-1 rounded-full border border-white/5">0 / 0 已完成</span>
            </div>

            <!-- Add Task Form -->
            <form onsubmit="addTask(event)" class="flex space-x-2 mb-4">
                <input type="text" id="task-input" placeholder="添加新任务..." autocomplete="off" class="flex-1 glass-input px-4 py-3 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-white placeholder-slate-500 transition">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-2xl font-semibold transition shadow-lg shadow-indigo-600/20">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <!-- Task List Container -->
            <div id="task-list" class="space-y-2.5 max-h-60 overflow-y-auto pr-1">
                <!-- Dynamic Tasks Render Here -->
            </div>
        </div>

    </main>

    <footer class="mt-8 text-xs text-slate-500 text-center">
        <p>&copy; 2026 FocusHub. Crafted for High Performance.</p>
    </footer>

    <script>
        // State Management
        let currentMode = 'pomodoro';
        let timeLeft = 25 * 60;
        let timerId = null;
        let isRunning = false;

        let tasks = JSON.parse(localStorage.getItem('focushub_tasks')) || [
            { id: 1, text: '完成网页架构设计', completed: true },
            { id: 2, text: '审阅项目代码与优化', completed: false }
        ];

        const quotes = [
            "保持专注，行动是治愈焦虑的良药。",
            "你不需要很厉害才能开始，但你需要开始才能很厉害。",
            "每一次微小的坚持，都是未来成功的伏笔。",
            "专注当下，把眼前的事做到极致。"
        ];

        // UI Elements
        const timerDisplay = document.getElementById('timer-display');
        const startText = document.getElementById('start-text');
        const startIcon = document.getElementById('start-icon');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const taskCounter = document.getElementById('task-counter');
        const quoteText = document.getElementById('quote-text');

        // Timer Logic
        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `(${timerDisplay.textContent}) FocusHub`;
        }

        function switchMode(mode) {
            currentMode = mode;
            clearInterval(timerId);
            isRunning = false;
            startText.textContent = '开始专注';
            startIcon.className = 'fa-solid fa-play';

            // Update tab styles
            ['pomodoro', 'shortBreak', 'longBreak'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if (m === mode) {
                    btn.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30';
                } else {
                    btn.className = 'px-5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition text-slate-400 hover:text-white';
                }
            });

            if (mode === 'pomodoro') timeLeft = 25 * 60;
            if (mode === 'shortBreak') timeLeft = 5 * 60;
            if (mode === 'longBreak') timeLeft = 15 * 60;
            updateDisplay();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startText.textContent = '继续专注';
                startIcon.className = 'fa-solid fa-play';
            } else {
                isRunning = true;
                startText.textContent = '暂停休息';
                startIcon.className = 'fa-solid fa-pause';
                timerId = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                    } else {
                        clearInterval(timerId);
                        isRunning = false;
                        alertSound();
                        startText.textContent = '开始专注';
                        startIcon.className = 'fa-solid fa-play';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            startText.textContent = '开始专注';
            startIcon.className = 'fa-solid fa-play';
            switchMode(currentMode);
        }

        function alertSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {
                console.log('Audio Context not supported or blocked');
            }
        }

        // Todo List Logic
        function renderTasks() {
            taskList.innerHTML = '';
            if (tasks.length === 0) {
                taskList.innerHTML = `<p class="text-center text-xs text-slate-500 py-4">暂无待办事项，快去添加吧~</p>`;
            }
            tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl glass-input transition hover:border-white/20 ${task.completed ? 'opacity-65' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center space-x-3 flex-1 cursor-pointer" onclick="toggleTask(${task.id})">
                        <div class="w-5 h-5 rounded-lg border border-slate-500 flex items-center justify-center transition ${task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-slate-900'}">
                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm text-slate-200 ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.text)}</span>
                    </div>
                    <button onclick="deleteTask(${task.id})" class="text-slate-500 hover:text-rose-400 p-1 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                taskList.appendChild(div);
            });

            const completedCount = tasks.filter(t => t.completed).length;
            taskCounter.textContent = `${completedCount} / ${tasks.length} 已完成`;
            localStorage.setItem('focushub_tasks', JSON.stringify(tasks));
        }

        function addTask(e) {
            e.preventDefault();
            const text = taskInput.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text, completed: false });
            taskInput.value = '';
            renderTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderTasks();
        }

        function newQuote() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            quoteText.textContent = `“${randomQuote}”`;
        }

        function toggleTheme() {
            const icon = document.getElementById('theme-icon');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                icon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
            }
        }

        function resetData() {
            if (confirm('确定要重置所有待办任务吗？')) {
                tasks = [];
                renderTasks();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initialize on load
        renderTasks();
        updateDisplay();
    </script>
</body>
</html>
